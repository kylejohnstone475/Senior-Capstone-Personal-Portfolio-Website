<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Main Menu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #f5f8f5;
        }

        .menu-container {
            padding: 0;
        }

        .menu-heading {
            margin: 0 0 18px;
            color: #a7b8ae;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        nav a,
        nav a:link,
        nav a:visited {
            display: block;
            padding: 12px 14px;
            border: 1px solid transparent;
            border-radius: 9px;
            background: transparent;
            color: #c1d0c6 !important;
            font-size: 13px;
            line-height: 1.5;
            text-decoration: none !important;
            overflow-wrap: anywhere;
            transition:
                background-color 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;
        }

        nav a:hover,
        nav a:focus-visible {
            background: #263e32;
            border-color: #3a5546;
            color: #ffffff !important;
            outline: none;
        }

        nav a:active {
            background: #314b3c;
            color: #dcebe2 !important;
        }

        nav a:focus-visible {
            outline: 2px solid #b6d8c8;
            outline-offset: 2px;
        }

        .menu-divider {
            height: 1px;
            margin: 22px 0;
            border: none;
            background: #34483e;
        }

        .menu-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #34483e;
            color: #8fa398;
            font-size: 11px;
            line-height: 1.7;
        }

        .menu-footer p {
            margin: 0;
        }
    </style>
</head>

<body>
    <div class="menu-container">

               <nav aria-label="Main navigation">
            <a href="home.html" target="rightside">Home</a>

            <a href="resume.html" target="rightside">Resume</a>

            <a href="aboutme.html" target="rightside">About Me</a>

            <a href="projectplan.html" target="rightside">
                Project Management Plan
            </a>

            <a href="eventreport.html" target="rightside">
                Event Report
            </a>

            <a href="casestudy.html" target="rightside">
                Ethical Case Study
            </a>

            <a href="programreview.html" target="rightside">
                Program Review
            </a>
        </nav>

        <hr class="menu-divider">

        <div class="menu-footer">
            <p>Kyle Johnstone</p>
            <p>Personal Portfolio</p>
        </div>

    </div>
</body>
</html>
